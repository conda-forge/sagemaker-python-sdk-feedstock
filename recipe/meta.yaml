{% set name = "sagemaker-python-sdk" %}
{% set version = "3.29.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/sagemaker/sagemaker-{{ version }}.tar.gz
  sha256: 87a20d0911d28a6e6040324e4109dba62c64dd1e201fd3f4931a7b05160b9019

build:
  noarch: python
  number: 0

requirements:
  run:
    - python >=3.9
    - sagemaker-core >=2.29.0,<3.0.0
    - sagemaker-train >=1.29.0,<2.0.0
    - sagemaker-serve >=1.29.0,<2.0.0
    - sagemaker-mlops >=1.29.0,<2.0.0

test:
  commands:
    - AWS_DEFAULT_REGION=us-east-1 python -c "import sagemaker"
    - AWS_DEFAULT_REGION=us-east-1 python -c "import sagemaker.core"
    - AWS_DEFAULT_REGION=us-east-1 python -c "import sagemaker.train"
    - AWS_DEFAULT_REGION=us-east-1 python -c "import sagemaker.serve"
    - AWS_DEFAULT_REGION=us-east-1 python -c "import sagemaker.mlops"

about:
  home: https://github.com/aws/sagemaker-python-sdk/
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Open source library for training and deploying models on Amazon SageMaker.
  doc_url: https://sagemaker.readthedocs.io/en/stable/
  dev_url: https://github.com/aws/sagemaker-python-sdk/

extra:
  recipe-maintainers:
    - mollyheamazon
    - mufaddal-rohawala
    - nargokul
    - aviruthen
